<svg xmlns="http://www.w3.org/2000/svg" width="900" height="70" viewBox="0 0 900 70" role="img" aria-label="GitHub Statistics">
  <defs>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#7B2FF7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3E8FF" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#F3E8FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F3E8FF" stop-opacity="0.85"/>
      <stop offset="0.58" stop-color="#F3E8FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#F3E8FF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3.6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7B2FF7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <text x="450" y="46" text-anchor="middle" textLength="316" lengthAdjust="spacing" font-family="Consolas, 'Courier New', monospace" font-size="30" font-weight="700" fill="url(#text)" filter="url(#glow)" opacity="0.5">GitHub Statistics</text>
  <text x="450" y="46" text-anchor="middle" textLength="316" lengthAdjust="spacing" font-family="Consolas, 'Courier New', monospace" font-size="30" font-weight="700" fill="url(#text)">GitHub Statistics</text>
  <text x="450" y="46" text-anchor="middle" textLength="316" lengthAdjust="spacing" font-family="Consolas, 'Courier New', monospace" font-size="30" font-weight="700" fill="url(#shine)">GitHub Statistics</text>

  <rect x="292" y="60" width="316" height="1.6" fill="url(#line)"/>

  <rect x="616" y="26" width="3" height="30" fill="#7B2FF7">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>