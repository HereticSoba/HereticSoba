<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="HereticSoba — Code • Coffee • Metal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0014"/>
      <stop offset="0.45" stop-color="#1A0033"/>
      <stop offset="0.78" stop-color="#2D0B5A"/>
      <stop offset="1" stop-color="#12002B"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7B2FF7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7B2FF7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3E8FF"/>
      <stop offset="0.5" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#7B2FF7"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7B2FF7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C084FC" stop-opacity="1"/>
      <stop offset="1" stop-color="#7B2FF7" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#A855F7" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="1.4" fill="#C084FC" fill-opacity="0.35"/>
    </pattern>

    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <clipPath id="frame">
      <rect x="0" y="0" width="1000" height="240"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <rect width="1000" height="240" fill="url(#grid)"/>
    <rect width="1000" height="240" fill="url(#dots)"/>

    <circle cx="150" cy="30" r="230" fill="url(#glowA)"/>
    <circle cx="870" cy="220" r="250" fill="url(#glowB)"/>

    <g fill="none" stroke="#A855F7" stroke-opacity="0.45" stroke-width="1.2">
      <path d="M0 70 H140 L175 105 H210"/>
      <path d="M0 170 H120 L150 140 H205"/>
      <path d="M1000 80 H870 L835 115 H800"/>
      <path d="M1000 165 H885 L855 135 H815"/>
    </g>
    <g fill="#C084FC">
      <circle cx="210" cy="105" r="3">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="205" cy="140" r="3">
        <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="800" cy="115" r="3">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="815" cy="135" r="3">
        <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g fill="none" stroke="#A855F7" stroke-width="2" stroke-opacity="0.7">
      <path d="M24 52 V24 H52"/>
      <path d="M948 24 H976 V52"/>
      <path d="M24 188 V216 H52"/>
      <path d="M948 216 H976 V188"/>
    </g>

    <rect x="110" y="30" width="780" height="2" fill="url(#line)"/>
    <rect x="110" y="208" width="780" height="2" fill="url(#line)"/>

    <text x="500" y="132" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="600" letter-spacing="10" fill="#A855F7" opacity="0.55" filter="url(#softglow)">HERETICSOBA</text>
    <text x="500" y="132" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="600" letter-spacing="10" fill="url(#title)" stroke="#F3E8FF" stroke-opacity="0.95" stroke-width="2" paint-order="stroke fill">HERETICSOBA</text>

    <text x="500" y="174" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" letter-spacing="9" fill="#D8B4FE">CODE · COFFEE · METAL</text>

    <rect x="0" y="-4" width="1000" height="2" fill="#C084FC" opacity="0.18">
      <animate attributeName="y" from="-4" to="244" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
